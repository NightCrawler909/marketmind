version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: marketmind-db
    ports:
      - "27017:27017"
    volumes:
      - marketmind_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: marketmind-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/marketmind
      # Ollama must be running on the host machine.
      # On Docker Desktop (Windows/Mac), use host.docker.internal.
      # On native Linux, use --add-host=host.docker.internal:host-gateway
      # or set OLLAMA_URL to your host's LAN IP.
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_MODEL=llama3
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketmind-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  marketmind_data:
